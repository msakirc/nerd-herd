[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nerd-herd"
version = "0.1.0"
description = "System-state ledger for local LLM hosts: GPU/VRAM, inference metrics, user presence, Prometheus export."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sakir Cimen" }]
keywords = ["gpu", "nvidia", "vram", "observability", "prometheus", "local-llm", "kutai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "yazbunu @ git+https://github.com/msakirc/yazbunu.git",
    # The `pynvml` module is provided by NVIDIA's nvidia-ml-py; the separate
    # `pynvml` distribution is a deprecated wrapper that only emits a warning.
    "nvidia-ml-py>=13.590",
    "psutil>=5.9.0",
    "prometheus_client>=0.20.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",    # __main__ (standalone server) reads the KutAI DB
    "python-dotenv>=1.0.0", # __main__ (standalone server) reads .env
]

[project.urls]
Homepage = "https://github.com/msakirc/nerd-herd"
Repository = "https://github.com/msakirc/nerd-herd"
Monorepo = "https://github.com/msakirc/kutai/tree/main/packages/nerd_herd"

[tool.setuptools.packages.find]
where = ["src"]
